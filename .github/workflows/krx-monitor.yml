name: KRX approval monitor

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: krx-approval-monitor
  cancel-in-progress: false

jobs:
  check:
    if: vars.KRX_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify monitor logic
        run: python3 -m unittest discover -s tests -v
      - name: Check KRX, email result and stop on success
        run: python3 scripts/check_krx.py
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          GITHUB_TOKEN: ${{ github.token }}
